# Incremental "threat diff" on every pull request - continuous threat modeling.
# Builds the threat model for the PR head and for the base branch, then comments
# on the PR with ONLY the threats this change introduces (plus resolved / changed).
name: PR threat diff

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write   # to post/update the PR comment

jobs:
  threat-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Model the base branch
        run: |
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          cd /tmp/base
          pip install -r requirements.txt || true
          python -m src.cli report --name base --code samples/py_webapp \
            --diagram samples/diagrams/py_webapp.mmd --out /tmp/base-out --slug base || true

      - name: Diff the PR head against the base
        id: diff
        run: |
          python -m src.cli diff --name "PR" --code samples/py_webapp \
            --diagram samples/diagrams/py_webapp.mmd \
            --old /tmp/base-out/base.threatforge.json --out diff.md || echo "no base model" > diff.md

      - name: Comment the threat diff on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('diff.md', 'utf8');
            const marker = '<!-- threatforge-diff -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            const content = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner,
                repo: context.repo.repo, comment_id: existing.id, body: content });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner,
                repo: context.repo.repo, issue_number: context.issue.number, body: content });
            }
